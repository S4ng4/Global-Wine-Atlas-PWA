<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Wine Dossier — Atelier Cellar</title>
    <meta name="description" content="Detailed sommelier wine dossier including terroir, elevation, aging, tasting notes, and food pairing.">
    <link rel="icon" type="image/png" href="./image/icon-96x96.png">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/atlas.css">
    <style>
        /* Mobile-First Single-Screen Sommelier Dossier */
        .dossier-shell {
            max-width: 1080px;
            margin: 0 auto;
            padding: 0.9rem 0.9rem 5.5rem;
        }

        .dossier-hero {
            display: grid;
            grid-template-columns: 104px 1fr;
            gap: 0.95rem;
            align-items: start;
            background: linear-gradient(155deg, rgba(26, 22, 18, 0.96) 0%, rgba(13, 11, 9, 0.98) 100%);
            border: 1px solid var(--atlas-border);
            border-radius: 18px;
            padding: 1.1rem 1rem;
            box-shadow: var(--atlas-specular), var(--atlas-shadow-md);
            margin-bottom: 1rem;
        }

        .dossier-bottle-stage {
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 55%, rgba(212, 175, 55, 0.13) 0%, transparent 72%);
            border-radius: 14px;
            padding: 0.45rem 0.25rem;
        }

        .dossier-bottle-stage .bottle-visual-frame { height: 220px; }

        .dossier-producer {
            font-family: var(--atlas-font-ui);
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--atlas-gold-soft);
            margin-top: 0.4rem;
            margin-bottom: 0.2rem;
        }

        .dossier-name {
            font-family: var(--atlas-font-editorial);
            font-size: clamp(1.5rem, 4.8vw, 2.55rem);
            font-weight: 600;
            line-height: 1.1;
            color: var(--atlas-ivory);
            margin-bottom: 0.4rem;
        }

        .dossier-origin-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.35rem;
            font-family: var(--atlas-font-ui);
            font-size: 0.74rem;
            color: var(--atlas-muted);
            margin-bottom: 0.7rem;
        }

        .dossier-origin-link {
            color: var(--atlas-gold-soft);
            text-decoration: none;
            border-bottom: 1px dashed rgba(212, 175, 55, 0.45);
        }

        .dossier-desc {
            font-family: var(--atlas-font-editorial);
            font-size: clamp(1.04rem, 2.2vw, 1.24rem);
            line-height: 1.5;
            color: var(--atlas-prose);
            margin-bottom: 0.85rem;
        }

        .dossier-price-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.75rem;
            padding-top: 0.8rem;
            border-top: 1px solid rgba(212, 175, 55, 0.14);
        }

        .dossier-prices {
            display: flex;
            align-items: baseline;
            gap: 0.9rem;
            flex-wrap: wrap;
            font-variant-numeric: tabular-nums;
        }

        .dossier-price-main {
            font-family: var(--atlas-font-display);
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--atlas-gold-soft);
        }

        .dossier-price-sub {
            font-family: var(--atlas-font-ui);
            font-size: 0.78rem;
            color: var(--atlas-muted);
        }

        .dossier-desktop-actions { display: none; gap: 0.5rem; }

        .dossier-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.95rem;
            margin-bottom: 1.65rem;
        }

        .dossier-card {
            background: linear-gradient(165deg, rgba(23, 20, 17, 0.95) 0%, rgba(13, 11, 9, 0.98) 100%);
            border: 1px solid var(--atlas-border);
            border-radius: 16px;
            padding: 1.15rem 1.2rem;
            box-shadow: var(--atlas-specular);
        }

        .dossier-card h2 {
            font-family: var(--atlas-font-display);
            font-size: 0.88rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--atlas-gold-soft);
            margin-bottom: 0.9rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(212, 175, 55, 0.14);
        }

        .tasting-row { margin-bottom: 0.75rem; }
        .tasting-row:last-child { margin-bottom: 0; }
        .tasting-label {
            font-family: var(--atlas-font-ui);
            font-size: 0.64rem;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--atlas-gold);
            margin-bottom: 2px;
        }
        .tasting-text {
            font-family: var(--atlas-font-editorial);
            font-size: 1.08rem;
            line-height: 1.45;
            color: var(--atlas-ivory);
        }

        .specs-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.65rem;
        }

        .spec-item {
            background: rgba(9, 8, 7, 0.58);
            border: 1px solid rgba(212, 175, 55, 0.12);
            border-radius: 11px;
            padding: 0.65rem 0.78rem;
        }

        .spec-item--wide { grid-column: 1 / -1; }

        .body-meter {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.35rem;
            margin-top: 0.4rem;
        }
        .body-seg { height: 6px; border-radius: 999px; background: rgba(212, 175, 55, 0.15); }
        .body-seg.filled { background: var(--atlas-gold); }

        /* Sticky Mobile Thumb-Zone Action Bar */
        .dossier-mobile-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 150;
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 0.5rem;
            padding: 0.6rem 0.85rem calc(0.65rem + env(safe-area-inset-bottom, 0px));
            background: rgba(12, 11, 9, 0.96);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-top: 1px solid var(--atlas-border);
            box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.55);
        }

        @media (min-width: 780px) {
            .dossier-shell { padding: 2rem 1.75rem 3.5rem; }
            .dossier-hero {
                grid-template-columns: 220px 1fr;
                gap: 2.25rem;
                align-items: center;
                padding: 2rem 2.25rem;
                margin-bottom: 1.4rem;
            }
            .dossier-bottle-stage .bottle-visual-frame { height: 320px; }
            .dossier-desktop-actions { display: flex; }
            .dossier-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.25rem; }
            .dossier-card { padding: 1.4rem 1.55rem; }
            .dossier-mobile-bar { display: none; }
        }
    </style>
</head>
<body data-page-title="Wine Dossier">
    <header class="atlas-topbar">
        <a href="./index.html" class="atlas-brand-link">
            <span class="atlas-crest-badge"><img src="./image/crest.svg" alt="Cellar Crest"></span>
            <span class="atlas-brand-text">
                <span class="atlas-brand-name" data-brand="venueName">Atelier Cellar</span>
                <span class="atlas-brand-sub">Sommelier Dossier</span>
            </span>
        </a>
        <nav class="atlas-nav-links" id="atlasNavLinks">
            <a href="./wine-map.html" class="atlas-nav-pill">&larr; World Atlas</a>
            <a href="./WineByTheGlass.html" class="atlas-nav-pill">By the Glass</a>
            <a href="./regions.html" class="atlas-nav-pill">Regions</a>
            <a href="./wine-comparison.html" class="atlas-nav-pill">
                Compare <span class="compare-badge" data-compare-count style="display:none;">0</span>
            </a>
        </nav>
        <button type="button" class="atlas-mobile-menu-btn" id="mobileNavToggle" aria-label="Menu">
            <svg class="atlas-ico" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
    </header>

    <main class="dossier-shell" id="dossierRoot">
        <div class="editorial-panel" style="text-align:center;padding:3rem;">Loading wine dossier...</div>
    </main>

    <nav class="dossier-mobile-bar" id="dossierMobileBar" aria-label="Wine actions" style="display:none;">
        <a href="./wine-map.html" class="atlas-btn" id="mobBackAtlasBtn">&larr; Atlas</a>
        <button type="button" class="atlas-btn atlas-btn--primary" id="mobCompareBtn">+ Compare</button>
        <button type="button" class="atlas-icon-btn" id="mobShareBtn" aria-label="Share wine">
            <svg class="atlas-ico" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
        </button>
    </nav>

    <script src="./js/world-atlas-data.js"></script>
    <script src="./js/brand.js"></script>
    <script src="./js/bottle-visual.js"></script>
    <script src="./js/cellar-store.js"></script>
    <script>
        (async function initDossier() {
            await window.AtlasBrand.ready;
            const store = window.AtlasStore;
            store.updateCompareBadges();

            const mobBtn = document.getElementById('mobileNavToggle');
            const nav = document.getElementById('atlasNavLinks');
            if (mobBtn && nav) mobBtn.addEventListener('click', () => nav.classList.toggle('is-mobile-open'));

            const wines = await store.loadWines();
            const params = new URLSearchParams(window.location.search);
            const wineNum = params.get('wine') || params.get('id');
            const wine = wines.find(w => String(w.wine_number) === String(wineNum)) || wines[0];
            const root = document.getElementById('dossierRoot');

            if (!wine) {
                root.innerHTML = `<div class="editorial-panel" style="text-align:center;"><h2>Wine not found</h2><a href="./wine-map.html" class="atlas-btn atlas-btn--primary" style="margin-top:1rem;">Return to World Atlas</a></div>`;
                return;
            }

            document.title = `${wine.wine_name} — ${window.AtlasBrand.get().venueName}`;
            const countryName = store.getCountryDisplayName(wine.country);
            const regionName = store.getRegionDisplayName(wine.country, wine.region);
            const bottlePrice = window.AtlasBrand.formatPrice(wine.wine_price_bottle || wine.wine_price);
            const glassPrice = wine.hasGlass ? window.AtlasBrand.formatPrice(wine.wine_price_glass) : '';
            const isCompared = store.getCompareIds().includes(String(wine.wine_number));
            const bodyLevel = wine.bodyMood === 'light-refreshing' ? 1 : (wine.bodyMood === 'rich-powerful' ? 3 : 2);
            const regionUrl = `./wine-map.html?country=${encodeURIComponent(wine.country)}&region=${encodeURIComponent(wine.region)}`;

            const related = wines.filter(w => w.wine_number !== wine.wine_number && (w.region === wine.region || w.country === wine.country)).slice(0, 3);

            root.innerHTML = `
                <div style="margin-bottom:0.8rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.5rem;">
                    <a href="${regionUrl}" class="atlas-btn atlas-btn--sm">&larr; ${store.escapeHtml(regionName)}</a>
                    <span style="font-family:var(--atlas-font-ui);font-size:0.7rem;color:var(--atlas-subtle);letter-spacing:0.14em;font-variant-numeric:tabular-nums;">CELLAR #${store.escapeHtml(wine.wine_number)}</span>
                </div>

                <section class="dossier-hero">
                    <div class="dossier-bottle-stage">
                        ${window.AtlasBottle.renderHtml(wine)}
                    </div>
                    <div>
                        <div style="display:flex;gap:0.35rem;flex-wrap:wrap;">
                            <span class="wine-style-badge wine-style-badge--${store.escapeHtml(wine.style)}">
                                <span class="style-dot style-dot--${store.escapeHtml(wine.style)}"></span>
                                ${store.escapeHtml(store.STYLE_META[wine.style]?.label || wine.style)}
                            </span>
                            ${wine.organic ? '<span class="organic-badge">Organic</span>' : ''}
                        </div>
                        <div class="dossier-producer">${store.escapeHtml(wine.wine_producer)}</div>
                        <h1 class="dossier-name">${store.escapeHtml(wine.wine_name)}</h1>
                        <div class="dossier-origin-row">
                            <a class="dossier-origin-link" href="./wine-map.html?country=${encodeURIComponent(wine.country)}">${store.escapeHtml(countryName)}</a>
                            <span>&rsaquo;</span>
                            <a class="dossier-origin-link" href="${regionUrl}">${store.escapeHtml(regionName)}</a>
                            ${wine.vintage ? `<span>&middot; ${store.escapeHtml(wine.vintage)}</span>` : ''}
                        </div>
                        <p class="dossier-desc">${store.escapeHtml(wine.wine_description || '')}</p>
                        <div class="dossier-price-bar">
                            <div class="dossier-prices">
                                <span class="dossier-price-main">${store.escapeHtml(bottlePrice)} <small style="font-size:0.68rem;font-family:var(--atlas-font-ui);color:var(--atlas-subtle);font-weight:400;">/ bottle</small></span>
                                ${glassPrice ? `<span class="dossier-price-sub">Glass <strong style="color:var(--atlas-gold-soft);">${store.escapeHtml(glassPrice)}</strong></span>` : ''}
                            </div>
                            <div class="dossier-desktop-actions">
                                <button type="button" class="atlas-btn ${isCompared ? 'atlas-btn--primary' : ''}" id="dossierCompareBtn">
                                    ${isCompared ? 'In Comparison ✓' : '+ Add to Compare'}
                                </button>
                                <button type="button" class="atlas-btn" id="dossierShareBtn">Share</button>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="dossier-grid">
                    <div class="dossier-card">
                        <h2>Sensory Tasting Notes</h2>
                        <div class="tasting-row">
                            <div class="tasting-label">Appearance</div>
                            <div class="tasting-text">${store.escapeHtml(wine.tasting_notes?.visual || 'Luminous and expressive in the glass.')}</div>
                        </div>
                        <div class="tasting-row">
                            <div class="tasting-label">Aromatics (Nose)</div>
                            <div class="tasting-text">${store.escapeHtml(wine.tasting_notes?.olfactory || 'Layered fruit, floral lift, and terroir nuance.')}</div>
                        </div>
                        <div class="tasting-row">
                            <div class="tasting-label">Palate &amp; Finish</div>
                            <div class="tasting-text">${store.escapeHtml(wine.tasting_notes?.gustatory || 'Balanced acidity, poised texture, and clean persistence.')}</div>
                        </div>
                        <div class="tasting-row" style="padding-top:0.7rem;border-top:1px solid rgba(212,175,55,0.12);">
                            <div class="tasting-label">Body Weight &mdash; ${store.escapeHtml(wine.body || 'Medium')}</div>
                            <div class="body-meter" aria-label="Body weight ${bodyLevel} of 3">
                                <div class="body-seg ${bodyLevel >= 1 ? 'filled' : ''}"></div>
                                <div class="body-seg ${bodyLevel >= 2 ? 'filled' : ''}"></div>
                                <div class="body-seg ${bodyLevel >= 3 ? 'filled' : ''}"></div>
                            </div>
                        </div>
                    </div>

                    <div class="dossier-card">
                        <h2>Terroir &amp; Vinification</h2>
                        <div class="specs-grid">
                            <div class="spec-item spec-item--wide">
                                <div class="tasting-label">Grape Varietals</div>
                                <div class="tasting-text">${store.escapeHtml(wine.varietals || '—')}</div>
                            </div>
                            <div class="spec-item">
                                <div class="tasting-label">Soil</div>
                                <div class="tasting-text">${store.escapeHtml(wine.soil || '—')}</div>
                            </div>
                            <div class="spec-item">
                                <div class="tasting-label">Elevation</div>
                                <div class="tasting-text">${store.escapeHtml(wine.elevation || '—')}</div>
                            </div>
                            <div class="spec-item">
                                <div class="tasting-label">Aging</div>
                                <div class="tasting-text">${store.escapeHtml(wine.aging || '—')}</div>
                            </div>
                            <div class="spec-item">
                                <div class="tasting-label">Alcohol</div>
                                <div class="tasting-text">${store.escapeHtml(wine.alcohol || '—')}</div>
                            </div>
                            ${wine.food_pairing ? `
                            <div class="spec-item spec-item--wide">
                                <div class="tasting-label">Culinary Pairings</div>
                                <div class="tasting-text">${store.escapeHtml(wine.food_pairing)}</div>
                            </div>` : ''}
                        </div>
                    </div>
                </section>

                ${related.length ? `
                <section>
                    <h2 style="font-family:var(--atlas-font-display);font-size:1.05rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--atlas-gold-soft);margin-bottom:0.85rem;">More from ${store.escapeHtml(countryName)}</h2>
                    <div class="wines-cards-grid" id="relatedWinesGrid">
                        ${related.map(w => store.renderWineCard(w)).join('')}
                    </div>
                </section>` : ''}
            `;

            // Wire mobile bottom bar + desktop compare/share buttons
            const mobBar = document.getElementById('dossierMobileBar');
            const mobBack = document.getElementById('mobBackAtlasBtn');
            const mobCmp = document.getElementById('mobCompareBtn');
            const mobShare = document.getElementById('mobShareBtn');
            const deskCmp = document.getElementById('dossierCompareBtn');
            const deskShare = document.getElementById('dossierShareBtn');

            if (mobBar) mobBar.style.display = '';
            if (mobBack) mobBack.href = regionUrl;

            const syncCompareLabels = (added) => {
                if (deskCmp) {
                    deskCmp.classList.toggle('atlas-btn--primary', added);
                    deskCmp.textContent = added ? 'In Comparison ✓' : '+ Add to Compare';
                }
                if (mobCmp) {
                    mobCmp.textContent = added ? 'Compared ✓' : '+ Compare';
                }
            };
            syncCompareLabels(isCompared);

            const handleCompare = () => {
                const res = store.toggleCompareId(wine.wine_number);
                if (!res.full) syncCompareLabels(res.added);
            };
            const handleShare = async () => {
                const shareData = {
                    title: `${wine.wine_name} — ${wine.wine_producer}`,
                    text: `${wine.wine_name} (${regionName}, ${countryName}) — ${wine.wine_description}`,
                    url: window.location.href
                };
                if (navigator.share) {
                    try { await navigator.share(shareData); return; } catch (_) {}
                }
                try {
                    await navigator.clipboard.writeText(window.location.href);
                    store.showToast('Wine link copied to clipboard');
                } catch (_) {
                    store.showToast('Copy the URL from your browser bar to share');
                }
            };

            if (deskCmp) deskCmp.addEventListener('click', handleCompare);
            if (mobCmp) mobCmp.addEventListener('click', handleCompare);
            if (deskShare) deskShare.addEventListener('click', handleShare);
            if (mobShare) mobShare.addEventListener('click', handleShare);

            const relGrid = document.getElementById('relatedWinesGrid');
            if (relGrid) {
                relGrid.querySelectorAll('.wine-card').forEach(card => {
                    const num = card.getAttribute('data-wine-number');
                    card.addEventListener('click', (e) => {
                        const cmp = e.target.closest('[data-compare-btn]');
                        if (cmp) {
                            e.stopPropagation();
                            const res = store.toggleCompareId(num);
                            if (!res.full) {
                                cmp.classList.toggle('is-added', res.added);
                                cmp.textContent = res.added ? 'Compared ✓' : '+ Compare';
                            }
                            return;
                        }
                        window.location.href = `./wine-details.html?wine=${encodeURIComponent(num)}`;
                    });
                });
            }
        })();
    </script>
</body>
</html>
